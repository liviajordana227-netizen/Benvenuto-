<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="theme-color" content="#050505">

    <title>Benvenuto Chicken</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css?v=2">
</head>

<body>

    <!-- =====================================================
         TELA INICIAL
    ====================================================== -->
    <div id="telaInicio" class="tela ativa">

        <div class="inicio">

            <h1>🍗 BENVENUTO CHICKEN</h1>

            <p class="subtitulo">
                Frango crocante, lanches e muito sabor!
            </p>

            <div class="imagens-inicio">

                <div class="imagem-card">
                    <div class="emoji-imagem">🍔</div>
                    <span>Lanche</span>
                </div>

                <div class="imagem-card">
                    <div class="emoji-imagem">🍗</div>
                    <span>Frango</span>
                </div>

                <div class="imagem-card">
                    <div class="emoji-imagem">🥤</div>
                    <span>Refri</span>
                </div>

            </div>

            <button
                class="btn-cardapio"
                onclick="mostrarTela('telaCategorias')">
                CARDÁPIO
            </button>

        </div>

    </div>


    <!-- =====================================================
         TELA DE CATEGORIAS
    ====================================================== -->
    <div id="telaCategorias" class="tela">

        <div class="cabecalho">
            <h1>🍽️ NOSSO CARDÁPIO</h1>

            <p>
                Escolha uma categoria
            </p>
        </div>

        <div id="categorias" class="categorias">

            <button
                class="categoria-btn"
                onclick="abrirCategoria('lanches')">
                🍔 LANCHES
            </button>

            <button
                class="categoria-btn"
                onclick="abrirCategoria('baldes')">
                🍗 BALDES
            </button>

            <button
                class="categoria-btn"
                onclick="abrirCategoria('combos')">
                🔥 COMBOS
            </button>

            <button
                class="categoria-btn"
                onclick="abrirCategoria('bebidas')">
                🥤 BEBIDAS
            </button>

            <button
                class="categoria-btn"
                onclick="abrirCategoria('porcoes')">
                🍟 PORÇÕES
            </button>

            <button
                class="categoria-btn"
                onclick="abrirCategoria('molhos')">
                🥣 MOLHOS
            </button>

        </div>

    </div>


    <!-- =====================================================
         TELA DE PRODUTOS
    ====================================================== -->
    <div id="telaProdutos" class="tela">

        <div class="topo-produtos">

            <button
                class="btn-voltar"
                onclick="mostrarTela('telaCategorias')">
                ← VOLTAR ÀS CATEGORIAS
            </button>

            <h1 id="tituloCategoria">
                CARDÁPIO
            </h1>

        </div>

        <div
            id="listaProdutos"
            class="lista-produtos">
        </div>

    </div>


    <!-- =====================================================
         BOTÃO FIXO DO CARRINHO
    ====================================================== -->
    <button
        id="botaoCarrinho"
        class="botao-carrinho"
        onclick="abrirCarrinho()">

        🛒
        <span>VER CARRINHO</span>

        <strong id="contadorCarrinho">
            0
        </strong>

    </button>


    <!-- =====================================================
         MODAL DO PRODUTO
    ====================================================== -->
    <div
        id="modalProduto"
        class="modal">

        <div class="modal-conteudo">

            <button
                class="fechar"
                onclick="fecharProduto()">
                ✕
            </button>

            <h2 id="produtoNome">
                Produto
            </h2>

            <p id="produtoDescricao">
            </p>

            <div class="produto-preco">
                R$ <span id="produtoPreco">0,00</span>
            </div>


            <!-- QUANTIDADE -->
            <div class="campo-opcao">

                <label>
                    QUANTIDADE
                </label>

                <div class="quantidade">

                    <button
                        type="button"
                        onclick="alterarQuantidade(-1)">
                        −
                    </button>

                    <span id="quantidadeProduto">
                        1
                    </span>

                    <button
                        type="button"
                        onclick="alterarQuantidade(1)">
                        +
                    </button>

                </div>

            </div>


            <!-- OPÇÕES DO PRODUTO -->
            <div id="opcoesProduto">
            </div>


            <!-- ADICIONAIS -->
            <div
                id="adicionaisProduto"
                class="opcoes-adicionais">
            </div>


            <button
                class="btn-adicionar"
                onclick="adicionarAoCarrinho()">

                🛒 ADICIONAR AO CARRINHO

            </button>

        </div>

    </div>


    <!-- =====================================================
         MODAL DO CARRINHO
    ====================================================== -->
    <div
        id="modalCarrinho"
        class="modal">

        <div class="modal-conteudo carrinho-conteudo">

            <button
                class="fechar"
                onclick="fecharCarrinho()">
                ✕
            </button>

            <h2>
                🛒 SEU CARRINHO
            </h2>


            <!-- ITENS -->
            <div id="listaCarrinho">
            </div>


            <!-- TOTAL -->
            <div class="total-carrinho">

                <span>
                    TOTAL:
                </span>

                <strong id="totalCarrinho">
                    R$ 0,00
                </strong>

            </div>


            <!-- =================================================
                 TIPO DO PEDIDO
            ================================================== -->

            <div class="secao-pedido">

                <h3>
                    📦 COMO VOCÊ QUER RECEBER?
                </h3>

                <label class="opcao-grande">

                    <input
                        type="radio"
                        name="tipoPedido"
                        value="Entrega"
                        onchange="mudarTipoPedido()">

                    🚚 ENTREGA

                </label>

                <label class="opcao-grande">

                    <input
                        type="radio"
                        name="tipoPedido"
                        value="Retirada"
                        onchange="mudarTipoPedido()">

                    🏪 RETIRADA

                </label>

            </div>


            <!-- =================================================
                 DADOS DO CLIENTE
            ================================================== -->

            <div
                id="dadosCliente"
                class="secao-formulario">

                <h3>
                    👤 SEUS DADOS
                </h3>

                <label>
                    Nome
                </label>

                <input
                    type="text"
                    id="nomeCliente"
                    placeholder="Digite seu nome">

            </div>


            <!-- =================================================
                 DADOS DE ENTREGA
            ================================================== -->

            <div
                id="dadosEntrega"
                class="secao-formulario"
                style="display:none;">

                <h3>
                    📍 ENDEREÇO DE ENTREGA
                </h3>

                <label>
                    Rua e número
                </label>

                <input
                    type="text"
                    id="ruaCliente"
                    placeholder="Digite sua rua e número">


                <label>
                    Bairro
                </label>

                <input
                    type="text"
                    id="bairroCliente"
                    placeholder="Digite seu bairro">

            </div>


            <!-- =================================================
                 OBSERVAÇÃO
            ================================================== -->

            <div class="secao-formulario">

                <label>
                    📝 Observação
                </label>

                <textarea
                    id="observacaoCliente"
                    placeholder="Alguma observação sobre o pedido?"></textarea>

            </div>


            <!-- =================================================
                 PAGAMENTO
            ================================================== -->

            <div class="secao-pagamento">

                <h3>
                    💳 FORMA DE PAGAMENTO
                </h3>


                <label class="opcao-grande">

                    <input
                        type="radio"
                        name="pagamento"
                        value="Dinheiro"
                        onchange="mostrarPagamento()">

                    💵 DINHEIRO

                </label>


                <label class="opcao-grande">

                    <input
                        type="radio"
                        name="pagamento"
                        value="Crédito"
                        onchange="mostrarPagamento()">

                    💳 CRÉDITO

                </label>


                <label class="opcao-grande">

                    <input
                        type="radio"
                        name="pagamento"
                        value="Débito"
                        onchange="mostrarPagamento()">

                    💳 DÉBITO

                </label>


                <label class="opcao-grande">

                    <input
                        type="radio"
                        name="pagamento"
                        value="PIX"
                        onchange="mostrarPagamento()">

                    🟢 PIX

                </label>

            </div>


            <!-- =================================================
                 INFORMAÇÕES DO PAGAMENTO
            ================================================== -->

            <div
                id="dadosPagamento">
            </div>


            <!-- =================================================
                 FINALIZAR
            ================================================== -->

            <button
                class="btn-finalizar"
                onclick="enviarWhatsApp()">

                📲 FINALIZAR PEDIDO NO WHATSAPP

            </button>

        </div>

    </div>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="script.js?v=2"></script>

</body>
</html>
